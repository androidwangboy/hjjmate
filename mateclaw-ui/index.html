<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HjjMate - AI 助手</title>
    <!-- Inter font preload -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <!-- App Initial Loader (B · brand centered) — inline so it paints before JS/CSS loads, fixes white flash -->
    <div id="app-initial-loader" aria-live="polite" aria-label="应用加载中">
      <div class="ail-card">
        <div class="ail-logo"><img src="/logo/hjjmate_logo.png" alt="HjjMate" /></div>
        <div class="ail-brand">Hjj<span>Mate</span></div>
        <div class="ail-sub">你的超级大脑 · 正在唤醒</div>
        <div class="ail-orb" aria-hidden="true"></div>
        <div class="ail-track" aria-hidden="true"><div class="ail-fill"></div></div>
        <div class="ail-hint">首次加载可能需要几秒…</div>
      </div>
    </div>
    <style>
      #app-initial-loader{position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:rgba(252,250,248,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:opacity .35s ease}
      #app-initial-loader.ail--hidden{opacity:0;pointer-events:none}
      .ail-card{display:flex;flex-direction:column;align-items:center;gap:14px;padding:32px 28px;background:#fff;border:1px solid #ebe3db;border-radius:20px;box-shadow:0 18px 48px rgba(58,32,19,.12);min-width:280px}
      .ail-logo{width:56px;height:56px;border-radius:16px;background:#1d1612;display:grid;place-items:center;box-shadow:0 12px 32px rgba(29,22,18,.18);animation:ail-breathe 2s ease-in-out infinite}
      .ail-logo img{width:38px;height:38px;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(217,109,70,.22))}
      .ail-brand{font-family:'Inter',sans-serif;font-size:16px;font-weight:800;letter-spacing:-.02em;color:#1d1612}
      .ail-brand span{color:#d96d46}
      .ail-sub{font-family:'Inter',sans-serif;font-size:12px;color:#9b7d6c;letter-spacing:.04em}
      .ail-orb{width:32px;height:32px;border-radius:50%;border:2.5px solid #ebe3db;border-top-color:#d96d46;animation:ail-spin .9s linear infinite}
      .ail-track{width:140px;height:3px;background:#ebe3db;border-radius:999px;overflow:hidden}
      .ail-fill{height:100%;width:42%;background:#d96d46;border-radius:999px;animation:ail-progress 1.1s ease-in-out infinite}
      .ail-hint{font-family:'Inter',sans-serif;font-size:11px;color:#9b7d6c;letter-spacing:.04em}
      @keyframes ail-breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
      @keyframes ail-spin{to{transform:rotate(360deg)}}
      @keyframes ail-progress{0%{transform:translateX(-100%)}50%{transform:translateX(220%)}100%{transform:translateX(-100%)}}
      @media (prefers-reduced-motion:reduce){.ail-logo,.ail-orb,.ail-fill{animation:none}.ail-orb{opacity:.6}}
      html.dark #app-initial-loader{background:rgba(23,17,14,.92)}
      html.dark .ail-card{background:#221a16;border-color:#3D3028}
      html.dark .ail-brand{color:#F0EAE4}
      html.dark .ail-orb{border-color:#2a211c;border-top-color:#d96d46}
      html.dark .ail-track{background:#2a211c}
    </style>
    <script>
      /* eslint-disable */
      (function(){
        try {
          var m = localStorage.getItem('mateclaw-theme');
          var isDark = m==='dark' || (m!=='light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if(isDark) document.documentElement.classList.add('dark');
        } catch(e){}
        // Safety: if Vue fails to boot, auto-hide after 8s so page is not trapped
        setTimeout(function(){
          var el=document.getElementById('app-initial-loader');
          if(el && !el.classList.contains('ail--hidden')){
            el.classList.add('ail--hidden');
            setTimeout(function(){ el.style.display='none'; }, 400);
          }
        }, 8000);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
